name: Build QQ Liquid Glass

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # JDK 17
      # ==============================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==============================
      # Android SDK
      # ==============================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ==============================
      # Gradle
      # ==============================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ==============================
      # Check environment
      # ==============================

      - name: Check Build Environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"


      # ==============================
      # Local Xposed API 82
      # ==============================

      - name: Prepare local Xposed API 82 JAR
        run: |
          mkdir -p app/libs

          curl -fL \
            "https://github.com/MALTF/XposedBridgeAPI/releases/download/v82/api-82.jar" \
            -o app/libs/api-82.jar

          test -s app/libs/api-82.jar

          echo "Xposed API 82:"
          ls -lh app/libs/api-82.jar


      # ==============================
      # Validate XML
      # ==============================

      - name: Validate XML resources
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          import sys

          root = pathlib.Path("app/src/main/res")
          errors = []

          for file in root.rglob("*.xml"):
              try:
                  ET.parse(file)
              except Exception as e:
                  errors.append(f"{file}: {e}")

          if errors:
              print("================================")
              print("XML VALIDATION FAILED")
              print("================================")

              for error in errors:
                  print(error)

              sys.exit(1)

          print("================================")
          print("ALL XML RESOURCES ARE VALID")
          print("================================")
          PY


      # ==============================
      # Clean
      # ==============================

      - name: Clean
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:clean


      # ==============================
      # Build Release
      # ==============================

      - name: Build Release
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease


      # ==============================
      # Locate APK
      # ==============================

      - name: Locate APK
        run: |
          echo "================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          echo ""

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ==============================
      # Rename APK
      # ==============================

      - name: Prepare APK
        run: |
          mkdir -p app/build/final

          cp "$APK_PATH" \
            "app/build/final/QQ-LiquidGlass-${{ github.run_number }}.apk"

          echo "================================"
          echo "FINAL APK"
          echo "================================"

          ls -lh app/build/final/


      # ==============================
      # Verify APK
      # ==============================

      - name: Verify APK
        run: |
          APK="app/build/final/QQ-LiquidGlass-${{ github.run_number }}.apk"

          test -f "$APK"
          test -s "$APK"

          echo "================================"
          echo "APK BUILD SUCCESS"
          echo "================================"

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"


      # ==============================
      # Upload APK
      # ==============================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QQ-LiquidGlass-${{ github.run_number }}
          path: app/build/final/QQ-LiquidGlass-${{ github.run_number }}.apk
          if-no-files-found: error